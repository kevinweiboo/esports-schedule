<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>综合赛程 · 英雄联盟 / 瓦洛兰特 / CS2 / F1</title>
<meta name="description" content="一张表看完英雄联盟、瓦洛兰特、CS2、F1 的赛程与赛果：按日分组、跨天赛事、F1 周末场次、关注队伍下一场，支持时区切换与日历导出。">
<meta name="theme-color" content="#0a0b0f">
<link rel="canonical" href="https://kevinweiboo.github.io/esports-schedule/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="综合赛程">
<meta property="og:title" content="综合赛程 · LoL / VAL / CS2 / F1">
<meta property="og:description" content="按日分组的综合电竞赛程：跨天赛事、F1 周末场次、关注队伍下一场，支持时区切换与日历导出。">
<meta property="og:url" content="https://kevinweiboo.github.io/esports-schedule/">
<meta property="og:image" content="https://kevinweiboo.github.io/esports-schedule/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="综合赛程 · LoL / VAL / CS2 / F1">
<meta name="twitter:description" content="按日分组的综合电竞赛程，支持关注队伍与日历导出。">
<meta name="twitter:image" content="https://kevinweiboo.github.io/esports-schedule/assets/og.png">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://files.haojiao.cc">
<link rel="dns-prefetch" href="https://files.haojiao.cc">
<link rel="stylesheet" href="assets/style.css">
<script src="data/schedule.js"></script>
<script src="assets/live.js"></script>
<script src="assets/app.js" defer></script>
</head>
<body>
<a class="skip" href="#agenda">跳到赛程列表</a>

<header class="top">
  <div class="shell top-in">
    <a class="brand" href="./" aria-label="综合赛程首页">
      <span class="mark" aria-hidden="true">赛</span>
      <span class="brand-t">ARENA</span>
      <span class="brand-s">综合赛程</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <button type="button" class="nav-b on" data-view="upcoming">赛程</button>
      <button type="button" class="nav-b" data-view="results">赛果</button>
    </nav>
    <div class="tools">
      <button type="button" class="icon" id="searchBtn" aria-label="搜索队伍或赛事" title="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <span class="live-pill" id="livePill" hidden title="实时比分"><i aria-hidden="true"></i><span id="livePillText">实时</span></span>
      <select id="tzTop" class="tz" aria-label="时区">
        <option value="Asia/Shanghai">北京时间</option>
        <option value="UTC">UTC</option>
        <option value="local">本机时区</option>
      </select>
      <button type="button" class="icon" id="followBtn" aria-label="查看我的关注" title="我的关注">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/></svg>
      </button>
      <span class="fresh" id="fresh" title="">—</span>
      <button type="button" class="btn-refresh" id="refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        <span id="refreshText">检查更新</span>
      </button>
    </div>
  </div>
</header>

<main class="shell" id="main">
  <noscript><div class="empty" style="margin-top:16px">这个页面需要启用 JavaScript 才能渲染赛程。</div></noscript>
  <div id="banner" class="banner-wrap"></div>

  <section class="hero" aria-labelledby="nowTitle">
    <div class="hero-main">
      <div class="kicker"><span class="ln" aria-hidden="true"></span><span id="kicker">TODAY</span></div>
      <h1 id="nowTitle">正在载入赛程…</h1>
      <p id="nowSub" class="now-sub"></p>
      <div class="hero-actions">
        <button type="button" class="btn primary" id="icsBtn">导出日历</button>
        <button type="button" class="btn ghost" id="jumpBtn">跳到下一场</button>
      </div>
    </div>
    <aside class="next" id="nextCard" aria-label="下一场"></aside>
  </section>

  <section class="week" aria-label="按日期筛选">
    <div class="week-head">
      <span id="weekLabel" class="week-label">本周</span>
      <div class="week-tools">
        <input type="date" id="datePick" class="date-pick" aria-label="选择日期">
        <div class="week-nav">
          <button type="button" data-week="-1" aria-label="上一周">‹</button>
          <button type="button" id="weekToday">回到本周</button>
          <button type="button" data-week="1" aria-label="下一周">›</button>
        </div>
      </div>
    </div>
    <div class="week-grid" id="weekGrid"></div>
  </section>

  <div class="bar">
    <div class="games" id="games" role="group" aria-label="项目筛选"></div>
    <div class="seg" role="group" aria-label="赛程或赛果">
      <button type="button" class="on" data-view="upcoming">赛程</button>
      <button type="button" data-view="results">赛果</button>
    </div>
    <button type="button" class="filter-btn" id="filterBtn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      筛选<span class="fcount" id="filterCount" hidden></span>
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索队伍 / 赛事" autocomplete="off" aria-label="搜索队伍或赛事">
    </label>
  </div>

  <div class="active-filter" id="activeFilter" hidden></div>
  <div class="follow-strip" id="followStrip" hidden></div>

  <div class="layout">
    <section id="agenda" class="agenda" aria-label="赛程列表"></section>
    <aside class="side" id="side" aria-label="关注与数据状态"></aside>
  </div>

  <footer class="foot">
    <span>数据来源：Riot · 号角 · 5EPlay · Jolpica</span>
    <span class="dot" aria-hidden="true"></span>
    <span id="footTz">时区 北京时间 (UTC+8)</span>
    <span class="dot" aria-hidden="true"></span>
    <span id="footCount"></span>
  </footer>
</main>

<dialog id="filters" class="sheet" aria-labelledby="filterTitle">
  <div class="sheet-head">
    <h2 id="filterTitle">筛选与设置</h2>
    <button type="button" class="icon close" id="filterClose" aria-label="关闭">×</button>
  </div>

  <div class="sheet-body">
    <section class="sr">
      <h3>赛区</h3>
      <select id="region" class="select-wide"><option value="">全部赛区</option></select>
    </section>

    <section class="sr">
      <h3>赛事级别</h3>
      <div class="chips" id="tiers"></div>
    </section>

    <section class="sr">
      <h3>显示</h3>
      <div class="chips">
        <button type="button" class="chip" id="practiceChip" aria-pressed="false">含练习赛</button>
        <button type="button" class="chip on" id="tbdChip" aria-pressed="true">显示待定对阵</button>
      </div>
    </section>

    <section class="sr">
      <h3>跳到日期</h3>
      <input type="date" id="datePickSheet" class="select-wide" aria-label="选择日期">
    </section>

    <section class="sr">
      <h3>时区</h3>
      <select id="tzSheet" class="select-wide">
        <option value="Asia/Shanghai">北京时间 (UTC+8)</option>
        <option value="UTC">UTC</option>
        <option value="local">本机时区</option>
      </select>
    </section>

    <section class="sr">
      <h3>导出与分享</h3>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="icsSheet">导出本周 .ics</button>
        <button type="button" class="btn ghost" id="shareBtn">复制当前视图链接</button>
      </div>
      <p class="hint">导出的日历包含当前筛选下、本周内的赛事与场次；复制链接会保留项目、日期、搜索等条件。</p>
    </section>
  </div>

  <div class="sheet-foot">
    <button type="button" class="btn ghost" id="resetFilters">重置</button>
    <button type="button" class="btn primary" id="applyFilters">完成</button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
