<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>综合赛事时间表</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23663dea'/%3E%3Cpath d='M9 8v16M23 8v16M9 16h14' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f0f19; --panel:#17171f; --card:#1b1b26; --card2:#222230; --hover:#232333;
  --line:#262633; --line2:#34344a;
  --tx:#e8e8f0; --tx2:#9a9aa8; --tx3:#5f5f70;
  --brand:#663dea; --brand2:#7e57ff; --brand-bg:rgba(102,61,234,.16);
  --green:#0ad90a; --live:#ff4d5e; --gold:#f0a029;
  --lol:#4b8bff; --valorant:#ff4655; --cs2:#f0a029; --f1:#a86bff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.5 Verdana,"Microsoft YaHei","PingFang SC",sans-serif}
a{color:inherit}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#33334a;border-radius:4px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 72px}

/* ---------- 顶栏 ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--brand);display:inline-flex;
  align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;font-style:normal}
h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.3px}
.updated{font-size:12px;color:var(--tx3)}
.updated.stale{color:var(--gold)}
.dots{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)}
.dot i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.dot.bad i{background:var(--live)}
.dot.bad{color:var(--live)}
select,input[type=search]{font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--line2);
  border-radius:6px;background:var(--card);color:var(--tx);outline:none}
select:focus,input[type=search]:focus{border-color:var(--brand)}
input[type=search]{min-width:170px}
.btn{font:inherit;font-size:13px;padding:5px 16px;border:1px solid var(--brand);border-radius:6px;
  background:var(--brand);color:#fff;cursor:pointer;font-weight:600}
.btn:hover{background:var(--brand2);border-color:var(--brand2)}
.btn:disabled{opacity:.5;cursor:default}
.refreshing{font-size:12px;color:var(--tx3);min-width:0}

/* ---------- 日历条 ---------- */
.calwrap{background:var(--panel);border-bottom:1px solid var(--line)}
.cal{max-width:1100px;margin:0 auto;padding:14px 20px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.cday{flex:none;width:52px;text-align:center;padding:6px 0 8px;border-radius:10px;cursor:pointer;
  border:1px solid transparent;user-select:none}
.cday:hover{background:var(--card)}
.cday .n{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.cday .w{font-size:11px;color:var(--tx3);line-height:1.4}
.cday .ev{font-size:10px;color:var(--brand2);line-height:1.5;min-height:15px}
.cday.today .n{color:var(--brand2)}
.cday.sel{background:var(--brand-bg);border-color:var(--brand)}
.cday.sel .n{color:#fff}
.cday.today.sel .n{color:#fff}
.cmon{flex:none;width:auto;writing-mode:vertical-lr;text-align:center;color:var(--tx3);font-size:11px;
  padding:6px 2px;letter-spacing:2px;display:flex;align-items:center;justify-content:center}

/* ---------- 指标卡 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;color:#fff}
.stat span{font-size:12px;color:var(--tx2)}

/* ---------- 筛选 ---------- */
.filters{margin-bottom:16px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.flabel{font-size:12px;color:var(--tx3);width:44px;flex:none}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.tab{font:inherit;font-size:13px;padding:5px 14px;border:0;border-radius:6px;background:transparent;
  color:var(--tx2);cursor:pointer}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--brand);color:#fff;font-weight:600}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 12px;
  font-size:12px;cursor:pointer;color:var(--tx2);user-select:none}
.chip:hover{border-color:var(--tx3);color:var(--tx)}
.chip.on{background:var(--brand-bg);border-color:var(--brand);color:#b9a5ff}
.chip.g-lol.on{border-color:var(--lol);color:var(--lol);background:rgba(75,139,255,.12)}
.chip.g-cs2.on{border-color:var(--cs2);color:var(--cs2);background:rgba(240,160,41,.12)}
.chip.g-valorant.on{border-color:var(--valorant);color:var(--valorant);background:rgba(255,70,85,.12)}
.chip.g-f1.on{border-color:var(--f1);color:var(--f1);background:rgba(168,107,255,.12)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);cursor:pointer}
.count{margin-left:auto;font-size:12px;color:var(--tx3)}
.chipset{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- 列表 ---------- */
.day{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.day h2{font-size:14px;font-weight:700;margin:0;color:#fff}
.day h2.hot{color:var(--brand2)}
.day em{font-style:normal;font-size:12px;color:var(--tx3)}
.list{display:flex;flex-direction:column;gap:8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center}
.card:hover{border-color:var(--line2);background:var(--hover)}
.card.live{border-color:rgba(255,77,94,.45)}
.card.expandable{cursor:pointer}
.c-time{text-align:right}
.c-time b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.c-time span{font-size:11px;color:var(--tx3);display:block;margin-top:2px}
.c-time span.hot{color:var(--live)}
.c-range{font-size:11px;color:var(--tx2)}
.c-mid{min-width:0}
.tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:#262633;color:var(--tx2);white-space:nowrap}
.tag.g-lol{background:rgba(75,139,255,.14);color:var(--lol)}
.tag.g-cs2{background:rgba(240,160,41,.14);color:var(--cs2)}
.tag.g-valorant{background:rgba(255,70,85,.14);color:var(--valorant)}
.tag.g-f1{background:rgba(168,107,255,.14);color:var(--f1)}
.tag.tier{background:var(--brand-bg);color:#b9a5ff}
.teams{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tm{display:flex;align-items:center;gap:6px;min-width:0}
.tm img{width:20px;height:20px;object-fit:contain}
.tm .ph{width:20px;height:20px;border-radius:4px;background:#2c2c3c;color:var(--tx2);
  font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tm span{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm.win span{color:#fff}
.tm.lose span{color:var(--tx3)}
.sc{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx)}
.vs{color:var(--tx3);font-size:12px}
.solo{font-size:14px;font-weight:600;color:#fff}
.c-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.badge-live{font-size:11px;color:#fff;background:var(--live);border-radius:4px;padding:1px 7px;font-weight:700}
.badge-up{font-size:11px;color:var(--brand2);border:1px solid var(--brand);border-radius:4px;padding:0 6px}
.badge-done{font-size:11px;color:var(--tx3)}
.meta-r{font-size:11px;color:var(--tx3)}
.lnk{font-size:12px;color:var(--brand2);text-decoration:none}
.lnk:hover{text-decoration:underline}
.limg{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#22222e;padding:4px}

/* 展开箭头与比赛明细 */
.caret{font-size:11px;color:var(--tx3);margin-left:6px;display:inline-block;transition:transform .15s}
.card.open .caret{transform:rotate(180deg)}
.mlist{grid-column:1/-1;border-top:1px solid var(--line);margin-top:4px;padding-top:8px;display:none}
.card.open .mlist{display:block}
.mrow{display:grid;grid-template-columns:64px 1fr auto 1fr 150px;gap:8px;align-items:center;
  padding:6px 4px;border-radius:6px;font-size:13px}
.mrow:hover{background:var(--hover)}
.mrow+.mrow{border-top:1px solid #22222e}
.mrow .mt{color:var(--tx2);font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
.mrow .mteam{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600}
.mrow .mteam img{width:18px;height:18px;object-fit:contain}
.mrow .mteam .ph{width:18px;height:18px;border-radius:4px;background:#2c2c3c;color:var(--tx2);font-size:9px;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.mrow .mteam span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mteam.r{justify-content:flex-end}
.mrow.win span{color:#fff}
.mrow.lose span{color:var(--tx3)}
.msc{font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx);text-align:center;min-width:44px}
.msc.ns{color:var(--tx3);font-weight:400}
.mstage{font-size:11px;color:var(--tx3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:5px;
  box-shadow:0 0 5px var(--live)}
.mdone{color:var(--tx3)}
.mfoot{font-size:11px;color:var(--tx3);margin-top:6px;text-align:right}

.empty{background:var(--card);border:1px dashed var(--line2);border-radius:10px;padding:40px 20px;text-align:center;color:var(--tx2)}
.empty code{background:#262633;padding:2px 6px;border-radius:4px;font-size:12px}
.warn{background:rgba(240,160,41,.1);border:1px solid rgba(240,160,41,.4);color:var(--gold);border-radius:8px;
  padding:8px 12px;font-size:12px;margin-bottom:14px}

@media(max-width:720px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .card{grid-template-columns:74px 1fr;gap:10px}
  .c-right{grid-column:2;text-align:left;align-items:flex-start}
  .c-time{text-align:left}
  .flabel{width:auto}
  .mrow{grid-template-columns:52px 1fr auto 1fr}
  .mstage{display:none}}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo"><i>赛</i><h1>综合赛事时间表</h1></div>
    <span class="updated" id="updated">—</span>
    <div class="dots" id="dots"></div>
    <button class="btn" id="refresh">更新</button>
    <span class="refreshing" id="refreshing"></span>
    <select id="tz" title="时区">
      <option value="Asia/Shanghai">北京时间</option>
      <option value="UTC">UTC</option>
      <option value="local">本机时区</option>
    </select>
  </div>
</header>

<div class="calwrap"><div class="cal" id="cal"></div></div>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="filters">
    <div class="frow">
      <span class="flabel">项目</span>
      <button class="chip g-lol on" data-game="lol">英雄联盟</button>
      <button class="chip g-valorant on" data-game="valorant">瓦洛兰特 CN</button>
      <button class="chip g-cs2 on" data-game="cs2">CS2</button>
      <button class="chip g-f1 on" data-game="f1">F1</button>
      <input type="search" id="q" placeholder="搜索队伍 / 赛事" style="margin-left:auto">
    </div>
    <div class="frow">
      <span class="flabel">状态</span>
      <div class="tabs">
        <button class="tab on" data-stab="upcoming">进行中和未开始</button>
        <button class="tab" data-stab="completed">已结束</button>
      </div>
      <label class="chk"><input type="checkbox" id="practice" checked> 含练习赛</label>
      <span class="count" id="count"></span>
    </div>
    <div class="frow">
      <span class="flabel">级别</span>
      <span class="chipset" id="tiers"></span>
      <select id="region" style="margin-left:8px"><option value="">全部赛区</option></select>
    </div>
  </div>

  <div id="warn"></div>
  <main id="list"></main>
</div>

<script src="data/schedule.js"></script>
<script>
(function(){
  var DATA = window.__SCHEDULE__ || { meta:null, events:[] };
  var TZ = { 'Asia/Shanghai':'Asia/Shanghai', 'UTC':'UTC', 'local':null };

  var state = {
    games: { lol:true, valorant:true, cs2:true, f1:true },
    stab: 'upcoming', day: '', tiers: null, region: '', q: '', practice: true,
    open: {}   // 展开的赛事明细 {eventId:true}
  };
  var TIER_ORDER = ['Major','S+','S级','国际大赛','大师赛','冠军赛','VCT CN','赛区联赛','练习赛'];

  var $ = function(id){ return document.getElementById(id); };

  function tz(){ var v = $('tz').value; return v==='local' ? undefined : v; }

  function dayKey(iso){
    var o = { year:'numeric', month:'2-digit', day:'2-digit' };
    if (tz()) o.timeZone = tz();
    return new Intl.DateTimeFormat('en-CA', o).format(new Date(iso));
  }
  function fmtTime(iso){
    var o = { hour:'2-digit', minute:'2-digit', hour12:false };
    if (tz()) o.timeZone = tz();
    return new Intl.DateTimeFormat('zh-CN', o).format(new Date(iso));
  }
  function fmtDay(iso){
    var o = { };
    if (tz()) o.timeZone = tz();
    var d = new Date(iso);
    var md = new Intl.DateTimeFormat('zh-CN', Object.assign({ month:'long', day:'numeric' }, o)).format(d);
    var wk = new Intl.DateTimeFormat('zh-CN', Object.assign({ weekday:'short' }, o)).format(d);
    return md + ' ' + wk;
  }
  function todayKey(){ return dayKey(new Date().toISOString()); }
  function shiftKey(n){
    var d = new Date(); d.setDate(d.getDate()+n); return dayKey(d.toISOString());
  }
  function weekday(iso){
    var o = { weekday:'narrow' };
    if (tz()) o.timeZone = tz();
    return new Intl.DateTimeFormat('zh-CN', o).format(new Date(iso));
  }

  // 数据里可能最多滞后 30 分钟，已到开赛时间的一律按进行中显示
  function eff(e){
    if (e.status === 'completed') return 'completed';
    if (e.status === 'live') return 'live';
    return Date.now() >= new Date(e.startTime).getTime() ? 'live' : 'upcoming';
  }

  function countdown(iso){
    var ms = new Date(iso).getTime() - Date.now();
    if (ms <= 0) return '已开始';
    var m = Math.floor(ms/60000), h = Math.floor(m/60), d = Math.floor(h/24);
    if (d > 0) return d + ' 天后';
    if (h > 0) return h + ' 小时 ' + (m%60) + ' 分后';
    if (m > 0) return m + ' 分钟后';
    return '即将开始';
  }

  function elapsed(iso){
    var ms = Date.now() - new Date(iso).getTime();
    if (ms < 0) return '即将开始';
    var m = Math.floor(ms/60000), h = Math.floor(m/60);
    if (h > 0) return '已进行 ' + h + ' 小时 ' + (m%60) + ' 分';
    if (m > 0) return '已进行 ' + m + ' 分钟';
    return '刚开始';
  }

  function matchQ(e, q){
    if (!q) return true;
    var hay = [e.league, e.tournament, e.stage, e.title, e.venue, e.region,
      (e.teams||[]).map(function(t){ return t.name + ' ' + t.code; }).join(' '),
      (e.matches||[]).map(function(m){ return m.t1.name + ' ' + m.t2.name; }).join(' ')].join(' ').toLowerCase();
    return hay.indexOf(q.toLowerCase()) >= 0;
  }

  function filtered(){
    var q = state.q.trim();
    return (DATA.events||[]).filter(function(e){
      if (!state.games[e.game]) return false;
      var st = eff(e);
      if (state.stab === 'completed' ? st !== 'completed' : st === 'completed') return false;
      if (state.day && dayKey(e.startTime) !== state.day) return false;
      if (!state.practice && e.tierKey === 'practice') return false;
      if (state.tiers && !state.tiers[e.tierLabel]) return false;
      if (state.region && e.regionGroup !== state.region) return false;
      return matchQ(e, q);
    });
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
    });
  }

  function teamHtml(t, other){
    var logo = t.logo
      ? '<img src="'+esc(t.logo)+'" alt="" loading="lazy">'
      : '<span class="ph">'+esc((t.code||t.name||'?').slice(0,3))+'</span>';
    var cls = '';
    if (t.score != null && other && other.score != null){
      cls = t.score > other.score ? ' win' : (t.score < other.score ? ' lose' : '');
    }
    return '<span class="tm'+cls+'">'+logo+'<span>'+esc(t.code||t.name)+'</span></span>';
  }

  // 跨天举办的赛事（CS2 / 瓦洛兰特是赛事级数据），按日期区间展示
  function isRange(e){
    if (!e.endTime) return false;
    return Date.parse(e.endTime) - Date.parse(e.startTime) > 36 * 3600 * 1000;
  }
  function fmtDayNum(iso){
    var o = { month:'2-digit', day:'2-digit' };
    if (tz()) o.timeZone = tz();
    return new Intl.DateTimeFormat('en-CA', o).format(new Date(iso));
  }

  // ---------- 比赛明细（CS2 具体对局）----------
  function mlogo(t){
    return t.logo
      ? '<img src="'+esc(t.logo)+'" alt="" loading="lazy">'
      : '<span class="ph">'+esc((t.name||'?').slice(0,3))+'</span>';
  }
  function matchListHtml(e){
    var ms = e.matches || [];
    if (!ms.length) return '';
    // 未来比赛排前，其次进行中，再按时间
    var rows = ms.map(function(m){
      var st = m.status === 'completed' ? 'completed' :
               (m.status === 'live' || Date.now() >= new Date(m.time).getTime()) ? 'live' : 'upcoming';
      var has = st === 'completed' && m.t1.score !== '' && m.t2.score !== '' &&
                m.t1.score !== null && m.t2.score !== null;
      var sc = has ? esc(m.t1.score)+' : '+esc(m.t2.score) : 'vs';
      var cls = has ? (Number(m.t1.score) > Number(m.t2.score) ? 'win' :
                (Number(m.t1.score) < Number(m.t2.score) ? 'lose' : '')) : '';
      var cls2 = has ? (Number(m.t2.score) > Number(m.t1.score) ? 'win' :
                 (Number(m.t2.score) < Number(m.t1.score) ? 'lose' : '')) : '';
      var live = st === 'live' ? '<span class="mlive"></span>' : '';
      return '<div class="mrow'+(st==='completed'?' mdone':'')+'">'
        + '<span class="mt">'+fmtTime(m.time)+'</span>'
        + '<span class="mteam '+cls+'">'+mlogo(m.t1)+'<span>'+esc(m.t1.name||'TBD')+'</span></span>'
        + '<span class="msc'+(has?'':' ns')+'">'+(st==='live'?live:'')+sc+'</span>'
        + '<span class="mteam r '+cls2+'"><span>'+esc(m.t2.name||'TBD')+'</span>'+mlogo(m.t2)+'</span>'
        + '<span class="mstage">'+esc(m.stage||'')+(m.bo?' · BO'+m.bo:'')+'</span>'
        + '</div>';
    }).join('');
    return '<div class="mlist">' + rows +
      '<div class="mfoot">共 '+ms.length+' 场 · 数据来源 5EPlay</div></div>';
  }

  function cardHtml(e){
    var st = eff(e);
    var teams = e.teams || [];
    var expandable = (e.matches || []).length > 0;
    var open = !!state.open[e.id];

    var mid = '';
    if (teams.length >= 2){
      var s1 = teams[0].score, s2 = teams[1].score;
      var score = (s1 != null && s2 != null)
        ? '<span class="sc">'+s1+' : '+s2+'</span>'
        : '<span class="vs">VS</span>';
      mid = teamHtml(teams[0], teams[1]) + score + teamHtml(teams[1], teams[0]);
    } else if (teams.length === 1){
      mid = teamHtml(teams[0], null);
    } else {
      mid = '<span class="solo">'+esc(e.title)+'</span>';
    }

    var tags = '<span class="tag g-'+e.game+'">'+esc(e.league)+'</span>';
    if (e.tierLabel && e.tierLabel !== e.league) {
      tags += '<span class="tag tier '+e.tierKey+'">'+esc(e.tierLabel)+'</span>';
    }
    if (e.stage && e.stage !== e.league && e.stage !== e.tierLabel) {
      tags += '<span class="tag">'+esc(e.stage)+'</span>';
    }
    if (e.bestOf) tags += '<span class="tag">BO'+e.bestOf+'</span>';
    if (expandable) tags += '<span class="tag">'+e.matches.length+' 场比赛<span class="caret">▼</span></span>';

    var right = '';
    if (st === 'live') right = '<span class="badge-live">进行中</span>';
    else if (st === 'upcoming') right = '<span class="badge-up">未开始</span>';
    else right = '<span class="badge-done">已结束</span>';
    if (e.venue) right += '<span class="meta-r">'+esc(e.venue)+'</span>';
    if (e.prize) right += '<span class="meta-r">'+esc(e.prize)+'</span>';
    if (e.leagueImage) right = '<img class="limg" src="'+esc(e.leagueImage)+'" loading="lazy" alt="">' + right;
    if (e.streams && e.streams.length){
      right += '<a class="lnk" href="'+esc(e.streams[0].url)+'" target="_blank" rel="noopener">直播 ›</a>';
    }

    var range = isRange(e);
    var days = range ? Math.round((Date.parse(e.endTime)-Date.parse(e.startTime))/86400000) : 0;

    var timeCell, cd;
    if (range){
      timeCell = '<b>'+fmtDayNum(e.startTime)+'</b>'
        + '<span class="c-range">至 '+fmtDayNum(e.endTime)+' · '+days+' 天</span>';
    } else {
      timeCell = '<b>'+fmtTime(e.startTime)+'</b>';
    }
    cd = st === 'upcoming'
      ? '<span data-cd="'+e.startTime+'">'+countdown(e.startTime)+'</span>'
      : (st === 'live'
          ? '<span class="hot" data-el="'+e.startTime+'">'+elapsed(e.startTime)+'</span>'
          : '<span>已结束</span>');

    return '<div class="card'+(st==='live'?' live':'')+(expandable?' expandable':'')+(open?' open':'')+'"'
      + (expandable ? ' data-expand="'+esc(e.id)+'"' : '') + '>'
      + '<div class="c-time">'+timeCell+cd+'</div>'
      + '<div class="c-mid"><div class="tags">'+tags+'</div><div class="teams">'+mid+'</div></div>'
      + '<div class="c-right">'+right+'</div>'
      + matchListHtml(e)
      + '</div>';
  }

  // ---------- 日期日历条 ----------
  function renderCal(){
    var tk = todayKey();
    var counts = {};
    (DATA.events||[]).forEach(function(e){
      if (!state.games[e.game]) return;
      if (eff(e) !== state.stab) return;
      var k = dayKey(e.startTime);
      counts[k] = (counts[k]||0) + 1;
    });
    var html = '';
    var lastMon = '';
    for (var i = -3; i <= 13; i++){
      var d = new Date(); d.setDate(d.getDate()+i);
      var iso = d.toISOString();
      var k = dayKey(iso);
      var mon = new Intl.DateTimeFormat('zh-CN', Object.assign({ year:'numeric', month:'long' },
        tz()?{timeZone:tz()}:{})).format(d);
      if (mon !== lastMon){ html += '<div class="cmon">'+mon+'</div>'; lastMon = mon; }
      var c = counts[k] || 0;
      html += '<div class="cday'+(k===tk?' today':'')+(k===state.day?' sel':'')+'" data-day="'+k+'">'
        + '<div class="n">'+d.getDate()+'</div>'
        + '<div class="w">'+weekday(iso)+'</div>'
        + '<div class="ev">'+(c ? c+'场' : '')+'</div>'
        + '</div>';
    }
    $('cal').innerHTML = html;
    document.querySelectorAll('.cday').forEach(function(el){
      el.onclick = function(){
        var k = el.getAttribute('data-day');
        state.day = (state.day === k) ? '' : k;
        render();
      };
    });
  }

  function render(){
    // 更新时间
    var up = $('updated'), m = DATA.meta;
    if (m && m.generatedAt){
      var mins = Math.round((Date.now() - new Date(m.generatedAt).getTime())/60000);
      var txt = mins < 1 ? '刚刚更新' : (mins < 60 ? mins+' 分钟前更新' : Math.round(mins/60)+' 小时前更新');
      up.textContent = txt;
      up.className = 'updated' + (mins > 90 ? ' stale' : '');
      up.title = new Date(m.generatedAt).toLocaleString('zh-CN');
    } else {
      up.textContent = '尚无数据';
    }

    // 数据源状态
    var dots = '';
    (m && m.sources ? m.sources : []).forEach(function(s){
      dots += '<span class="dot'+(s.ok?'':' bad')+'" title="'+esc(s.error||(s.count+' 场'))+'">'
        + '<i></i>'+esc(s.label)+' '+s.count+'</span>';
    });
    $('dots').innerHTML = dots;

    // 数据缺失提示
    var warn = '';
    if (m && m.sources){
      var bad = m.sources.filter(function(s){ return !s.ok; });
      if (bad.length){
        warn += '<div class="warn">以下数据源本次抓取失败，显示的是上一次缓存或为空：'
          + bad.map(function(s){ return esc(s.label)+'（'+esc(s.error)+'）'; }).join('；') + '</div>';
      }
    }
    $('warn').innerHTML = warn;

    // 指标
    var all = DATA.events || [];
    var tk = todayKey(), wk = shiftKey(6);
    var n = function(f){ return all.filter(f).length; };
    var liveN = n(function(e){ return eff(e)==='live'; });
    $('stats').innerHTML =
      stat(n(function(e){ return dayKey(e.startTime)===tk; }), '今日场次') +
      stat(liveN, '进行中') +
      stat(n(function(e){ var k=dayKey(e.startTime); return k>=tk && k<=wk; }), '未来 7 天') +
      stat(all.length, '已收录');

    // 赛区下拉
    var regions = {};
    all.forEach(function(e){ regions[e.regionGroup] = 1; });
    var sel = $('region'), cur = state.region;
    sel.innerHTML = '<option value="">全部赛区</option>' +
      Object.keys(regions).sort().map(function(r){
        return '<option value="'+esc(r)+'"'+(r===cur?' selected':'')+'>'+esc(r)+'</option>';
      }).join('');
    sel.value = cur;

    // 级别筛选（按数据里出现的级别动态生成）
    var labels = {};
    all.forEach(function(e){ if (e.tierLabel) labels[e.tierLabel] = 1; });
    var tierList = Object.keys(labels).sort(function(a, b){
      var ia = TIER_ORDER.indexOf(a), ib = TIER_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    if (!state.tiers){
      state.tiers = {};
      tierList.forEach(function(l){ state.tiers[l] = true; });
    }
    $('tiers').innerHTML = tierList.map(function(l){
      return '<button class="chip'+(state.tiers[l] ? ' on' : '')+'" data-tier="'+esc(l)+'">'+esc(l)+'</button>';
    }).join('');
    document.querySelectorAll('#tiers [data-tier]').forEach(function(b){
      b.onclick = function(){
        var l = b.getAttribute('data-tier');
        state.tiers[l] = !state.tiers[l];
        b.classList.toggle('on', state.tiers[l]);
        render();
      };
    });

    renderCal();

    // 列表
    var rows = filtered();
    $('count').textContent = rows.length + ' 场';

    if (!all.length){
      $('list').innerHTML = '<div class="empty">还没有数据。<br><br>在项目目录执行：<br><br>'
        + '<code>node scripts/fetch.mjs</code></div>';
      return;
    }
    if (!rows.length){
      $('list').innerHTML = '<div class="empty">当前筛选条件下没有比赛，换个条件试试。</div>';
      return;
    }

    var order = [], byKey = {};
    rows.slice(0, 400).forEach(function(e){
      var k = dayKey(e.startTime);
      if (!byKey[k]){ byKey[k] = []; order.push(k); }
      byKey[k].push(e);
    });

    var tkNow = todayKey(), t1 = shiftKey(1), ty = shiftKey(-1);
    var html = order.map(function(k){
      var label = k===tkNow ? '今天' : (k===t1 ? '明天' : (k===ty ? '昨天' : fmtDay(byKey[k][0].startTime)));
      return '<div class="day" id="d-'+k+'"><h2'+(k===tkNow?' class="hot"':'')+'>'+esc(label)+'</h2><em>'+esc(k)+'</em></div>'
        + '<div class="list">' + byKey[k].map(cardHtml).join('') + '</div>';
    }).join('');

    $('list').innerHTML = html;

    // 展开/收起比赛明细
    document.querySelectorAll('[data-expand]').forEach(function(el){
      el.onclick = function(){
        var id = el.getAttribute('data-expand');
        state.open[id] = !state.open[id];
        el.classList.toggle('open', !!state.open[id]);
      };
    });
  }

  function stat(v, l){ return '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>'; }

  // 每秒刷新倒计时
  setInterval(function(){
    document.querySelectorAll('[data-cd]').forEach(function(el){
      el.textContent = countdown(el.getAttribute('data-cd'));
    });
    document.querySelectorAll('[data-el]').forEach(function(el){
      el.textContent = elapsed(el.getAttribute('data-el'));
    });
  }, 1000);

  // 心跳：告诉本地服务“网页还开着”，全部关掉后服务会自动退出
  var CLIENT_ID = 'c' + Math.random().toString(36).slice(2, 10);
  var serverAlive = null;   // null=本地文件打开 / 未知，true=本地服务，false=静态托管（GitHub Pages 等）
  function viaHttp(){ return location.protocol === 'http:' || location.protocol === 'https:'; }
  function setMode(){
    var btn = $('refresh');
    if (serverAlive === false){
      btn.textContent = '检查更新';
      btn.title = '静态部署：数据由服务器定时更新，这里只重新载入数据文件';
    } else {
      btn.textContent = '更新';
      btn.title = '重新抓取一次数据';
    }
  }
  function beat(){
    if (!viaHttp()) return;
    fetch('/api/ping?id=' + CLIENT_ID)
      .then(function(r){ serverAlive = r.ok; setMode(); })
      .catch(function(){ serverAlive = false; setMode(); });
  }
  if (viaHttp()){
    beat();
    setInterval(beat, 5000);
    window.addEventListener('beforeunload', function(){
      if (navigator.sendBeacon) navigator.sendBeacon('/api/bye?id=' + CLIENT_ID);
    });
    // 静态部署没有后端，改为定时检查数据文件有没有被更新
    setInterval(function(){
      if (serverAlive !== false) return;
      reloadData(function(d){
        if (d && d.meta && d.meta.generatedAt &&
            (!DATA.meta || d.meta.generatedAt !== DATA.meta.generatedAt)){
          DATA = d; state.tiers = null; render();
        }
      });
    }, 10 * 60 * 1000);
  }

  // 重新载入数据文件（不重新抓取）
  function reloadData(cb){
    var s = document.createElement('script');
    s.src = 'data/schedule.js?t=' + Date.now();
    s.onload = function(){ cb(window.__SCHEDULE__ && window.__SCHEDULE__.events ? window.__SCHEDULE__ : null); };
    s.onerror = function(){ cb(null); };
    document.body.appendChild(s);
  }

  // 更新按钮：通过本地服务触发真实抓取；file:// 打开时只重新载入数据文件
  $('refresh').onclick = function(){
    var btn = $('refresh'), tip = $('refreshing');
    btn.disabled = true;
    tip.textContent = '更新中…';

    var done = function(msg){
      btn.disabled = false;
      tip.textContent = msg || '';
      if (msg) setTimeout(function(){ if (tip.textContent === msg) tip.textContent = ''; }, 6000);
    };

    // 静态托管（GitHub Pages / Vercel 等）：没有后端，只能重新载入数据文件
    if (serverAlive === false){
      reloadData(function(d){
        if (!d){ done('载入失败'); return; }
        if (DATA.meta && d.meta && d.meta.generatedAt === DATA.meta.generatedAt){
          done('暂无新数据');
        } else {
          DATA = d; state.tiers = null; render(); done('已载入最新数据');
        }
      });
      return;
    }

    if (!viaHttp()){
      reloadData(function(d){
        if (d){ DATA = d; render(); done('已重新载入数据文件'); }
        else done('载入失败，请运行 node scripts/fetch.mjs');
      });
      return;
    }

    fetch('/api/refresh', { method: 'POST' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || '抓取失败');
        reloadData(function(d){
          if (d){ DATA = d; state.tiers = null; render(); done('已更新 ' + j.total + ' 场'); }
          else done('数据文件载入失败');
        });
      })
      .catch(function(err){
        done('抓取失败：' + (err.message || err));
      });
  };

  // 事件绑定
  document.querySelectorAll('[data-game]').forEach(function(b){
    b.onclick = function(){
      var g = b.dataset.game;
      state.games[g] = !state.games[g];
      b.classList.toggle('on', state.games[g]);
      render();
    };
  });
  document.querySelectorAll('[data-stab]').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('[data-stab]').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); state.stab = b.dataset.stab; render();
    };
  });
  $('tz').onchange = render;
  $('region').onchange = function(){ state.region = this.value; render(); };
  $('practice').onchange = function(){ state.practice = this.checked; render(); };
  var timer;
  $('q').oninput = function(){
    clearTimeout(timer);
    var v = this.value;
    timer = setTimeout(function(){ state.q = v; render(); }, 200);
  };

  render();
})();
</script>
</body>
</html>
