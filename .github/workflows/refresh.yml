name: Refresh schedule

on:
  schedule:
    # 每 3 小时整点跑一次。
    # 别写 */30：GitHub 对高频计划任务会排队/跳过，实测实际间隔会漂到 2~5 小时，
    # 频率写低一点反而执行得更稳定。
    - cron: '0 */3 * * *'
  workflow_dispatch:

# 同一时间只允许一个刷新任务在跑，避免上一次还没结束又触发一次导致互相覆盖
concurrency:
  group: refresh-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 所有数据源都不需要 token。下面两个是可选的：不配就用 config.mjs 里的默认值。
      # 如果某个源在境外 IP 下失败，脚本会保留上一次的数据，不会让页面变空。
      - name: Fetch schedule
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          HAOJIAO_SECRET: ${{ secrets.HAOJIAO_SECRET }}
        run: node scripts/fetch.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "数据无变化"
          else
            git commit -m "chore: refresh schedule data"
            git push
          fi
